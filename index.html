<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rithub</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="topbar">

    <div class="brand-left">
      PROJECTS
    </div>

    <div class="brand-right">

      <button
        id="addProjectBtn"
        class="plus-button"
        aria-label="New project"
      >
        +
      </button>

      <div class="brand-name">
        Rithub
      </div>

    </div>

  </header>


  <main class="container">

    <!-- HOME -->

    <section id="homeView">

      <div id="projectsGrid" class="projects-grid"></div>

    </section>


    <!-- PROJECT -->

    <section id="projectView" class="hidden">

      <div class="project-nav">

        <button
          id="backBtn"
          class="text-button"
        >
          ← Projects
        </button>

        <button
          id="cancelProjectBtn"
          class="cancel-button"
        >
          Cancel Project
        </button>

      </div>


      <div class="project-header">

        <h1 id="projectTitle"></h1>

        <button
          id="commitBtn"
          class="commit-button"
        >
          + Commit
        </button>

      </div>


      <section class="project-section">

        <div class="section-label">
          NEXT COMMITS
        </div>

        <div id="nextSteps"></div>

        <button
          id="addStepBtn"
          class="text-button"
        >
          + Next step
        </button>

      </section>


      <section class="project-section">

        <div class="section-label">
          HISTORY
        </div>

        <div id="commitHistory"></div>

      </section>

    </section>

  </main>


  <!-- NEW PROJECT -->

  <div id="projectModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-title">
        NEW PROJECT
      </div>

      <input
        id="projectNameInput"
        placeholder="Project name"
        autocomplete="off"
      />

      <div class="modal-actions">

        <button
          id="cancelProjectModalBtn"
          class="text-button"
        >
          Cancel
        </button>

        <button
          id="saveProjectBtn"
          class="commit-button"
        >
          Create
        </button>

      </div>

    </div>

  </div>


  <!-- NEW COMMIT -->

  <div id="commitModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-title">
        NEW COMMIT
      </div>

      <textarea
        id="commitInput"
        placeholder="What did you do?"
      ></textarea>


      <div class="section-label">
        NEXT COMMITS
      </div>

      <div id="commitNextSteps"></div>

      <button
        id="addCommitStepBtn"
        class="text-button"
      >
        + Next step
      </button>


      <div class="modal-actions">

        <button
          id="cancelCommitBtn"
          class="text-button"
        >
          Cancel
        </button>

        <button
          id="saveCommitBtn"
          class="commit-button"
        >
          Commit
        </button>

      </div>

    </div>

  </div>


  <footer class="footer-mark">
    ALL WORK / NO PLAY
  </footer>


  <script src="app.js"></script>

</body>
</html>
