
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rithub</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>

<body>
  <header class="topbar">
    <div></div>
    <div class="topbar-actions">
      <button id="syncButton" class="new-project-button">
        SYNC
      </button>
      <button id="newProjectBtn" class="new-project-button">
        + Rithub it
      </button>
    </div>
  </header>

  <main>
    <section id="homeView" class="page">
      <div id="projectsList" class="projects-list"></div>
    </section>

    <section id="projectView" class="page hidden">
      <div class="project-top">
        <button id="backButton" class="plain-button">
          &lt;- BACK TO THE ALL WORK
        </button>
        <button id="cancelProjectButton" class="cancel-button">
          CANCEL PROJECT
        </button>
      </div>

      <div class="project-title-row">
        <h1 id="projectTitle"></h1>
        <button id="commitButton" class="commit-button">
          COMMIT
        </button>
      </div>

      <section class="section">
        <div class="section-heading">NEXT COMMIT</div>
        <div id="nextCommitList" class="next-list"></div>
        <button id="addNextButton" class="plain-button add-button">
          + ADD NEXT
        </button>
      </section>

      <section class="section history-section">
        <div class="section-heading">HISTORY</div>
        <div id="historyList" class="history-list"></div>
      </section>
    </section>
  </main>

  <div id="projectModal" class="modal hidden">
    <div class="modal-inner">
      <div class="modal-heading">NEW PROJECT</div>
      <input id="projectNameInput" type="text" placeholder="name" autocomplete="off" />

      <div class="modal-actions">
        <button id="closeProjectModal" class="plain-button">CANCEL</button>
        <button id="createProjectButton" class="commit-button">CREATE</button>
      </div>
    </div>
  </div>

  <div id="commitModal" class="modal hidden">
    <div class="modal-inner">
      <div class="modal-heading">NEW COMMIT</div>
      <textarea id="commitInput" placeholder="what happened?"></textarea>

      <div class="commit-next-heading">NEXT</div>
      <div id="commitNextList" class="commit-next-list"></div>

      <button id="addCommitNextButton" class="plain-button add-button">
        + ADD NEXT
      </button>

      <div class="modal-actions">
        <button id="closeCommitModal" class="plain-button">CANCEL</button>
        <button id="saveCommitButton" class="commit-button">COMMIT</button>
      </div>
    </div>
  </div>

  <div id="syncModal" class="modal hidden">
    <div class="modal-inner">
      <div class="modal-heading">CLOUD SYNC</div>

      <div id="syncStatus" class="sync-status">not configured</div>

      <input id="syncTokenInput" type="password" placeholder="github token (gist scope)" autocomplete="off" />

      <input id="syncGistInput" type="text" placeholder="gist id — only for the 2nd device" autocomplete="off" />
      <div class="sync-hint">First device: leave the gist id empty and a private gist is created for you. Other devices: paste the same token + the gist id shown here after enabling.</div>

      <div class="modal-actions">
        <button id="closeSyncModal" class="plain-button">CLOSE</button>
        <button id="disableSyncButton" class="plain-button hidden">DISCONNECT</button>
        <button id="syncNowButton" class="plain-button hidden">SYNC NOW</button>
        <button id="enableSyncButton" class="commit-button">ENABLE</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    ALL WORK AND NO PLAY MAKES ME A LLUD GIRL
  </footer>

  <script src="app.js?v=4"></script>
</body>
</html>
