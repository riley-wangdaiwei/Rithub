<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rithub · Time Report</title>
  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f4ec;
      color: #151515;
      font-family:
        "Courier New",
        Courier,
        monospace;
      font-size: 14px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    .topbar {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #151515;
    }

    .topbar-title {
      font-size: 14px;
      letter-spacing: 0.05em;
    }

    .new-project-button {
      border: none;
      background: transparent;
      padding: 0;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      color: #151515;
    }

    .new-project-button:hover {
      color: #9b0000;
    }

    main {
      padding: 20px;
      max-width: 560px;
      margin: 0 auto;
    }

    pre {
      font-family:
        "Courier New",
        Courier,
        monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre;
      overflow-x: auto;
      margin: 0 0 20px 0;
    }

    .report-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .copy-button {
      border: 1px solid #151515;
      background: #151515;
      color: #f7f4ec;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .copy-button:hover {
      background: #9b0000;
      border-color: #9b0000;
    }

    .copy-msg {
      font-size: 12px;
      color: #555;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #888;
      padding: 24px 0;
    }

  </style>
</head>

<body>
  <header class="topbar">
    <a class="new-project-button" href="index.html">
      &lt;- BACK
    </a>
    <div class="topbar-title">TIME REPORT</div>
    <div></div>
  </header>

  <main>
    <pre id="reportPre">loading…</pre>

    <div class="report-actions">
      <button id="copyButton" class="copy-button">
        COPY WEEK DATA
      </button>
      <span id="copyMsg" class="copy-msg"></span>
    </div>
  </main>

  <footer class="footer">
    ALL WORK AND NO PLAY MAKES ME A LLUD GIRL
  </footer>

  <script src="report.js?v=2"></script>
  <script>

    (function () {

      var STORAGE_KEY = "rithub-v2";


      function loadProjects() {

        var raw = null;


        try {

          raw = JSON.parse(
            localStorage.getItem(STORAGE_KEY)
          );

        } catch (e) {

          raw = null;

        }


        if (Array.isArray(raw)) {

          return raw;

        }


        if (raw && Array.isArray(raw.projects)) {

          return raw.projects;

        }


        return [];

      }


      var reportText =
        buildReport(loadProjects(), Date.now());


      var pre =
        document.getElementById("reportPre");


      pre.textContent = reportText;


      var copyMsg =
        document.getElementById("copyMsg");


      function flash(msg) {

        copyMsg.textContent = msg;


        setTimeout(function () {

          copyMsg.textContent = "";

        }, 2000);

      }


      document
        .getElementById("copyButton")
        .addEventListener("click", function () {

          function done(ok) {

            flash(ok ? "COPIED" : "COPY FAILED");

          }


          if (
            navigator.clipboard &&
            navigator.clipboard.writeText
          ) {

            navigator.clipboard
              .writeText(reportText)
              .then(
                function () { done(true); },
                function () { fallback(); }
              );

          } else {

            fallback();

          }


          function fallback() {

            var ta =
              document.createElement("textarea");


            ta.value = reportText;

            ta.style.position = "fixed";

            ta.style.opacity = "0";


            document.body.appendChild(ta);

            ta.select();


            var ok = false;


            try {

              ok = document.execCommand("copy");

            } catch (e) {

              ok = false;

            }


            document.body.removeChild(ta);

            done(ok);

          }

        });

    })();

  </script>
</body>
</html>
