<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rithub · Time Report</title>
  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #151515;
      font-family:
        "Courier New",
        Courier,
        monospace;
      font-size: 14px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    .topbar {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #151515;
    }

    .topbar-title {
      font-size: 14px;
      letter-spacing: 0.05em;
    }

    .new-project-button {
      border: none;
      background: transparent;
      padding: 0;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      color: #151515;
    }

    .new-project-button:hover {
      color: #9b0000;
    }

    main {
      padding: 20px;
      max-width: 560px;
      margin: 0 auto;
    }

    pre {
      font-family:
        "Courier New",
        Courier,
        monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre;
      overflow-x: auto;
      margin: 0 0 20px 0;
    }

    .report-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .copy-button {
      border: 1px solid #151515;
      background: #151515;
      color: #f7f4ec;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .copy-button:hover {
      background: #9b0000;
      border-color: #9b0000;
    }

    .copy-msg {
      font-size: 12px;
      color: #555;
    }

    /* DEEP WEEK dot grid — black = work,
       light = empty, red = deep work */
    .deepweek-section {
      margin: 6px 0 28px 0;
    }


    .deepweek-title {
      font-size: 12px;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
    }

    .dw-row {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }

    .dw-label {
      width: 58px;
      flex: none;
      font-family:
        "Courier New",
        Courier,
        monospace;
      font-size: 10px;
      color: #777;
    }

    .dw-dots {
      display: flex;
      gap: 2px;
    }

    .dw-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: none;
    }

    .dw-empty { background: #e3ded2; }
    .dw-work { background: #1c1c1c; }
    .dw-deep { background: #c93a2e; }

    .dw-axis {
      display: flex;
      align-items: flex-end;
      margin-bottom: 6px;
    }

    .dw-axis .dw-label {
      color: transparent;
    }

    .dw-tick {
      width: 7px;
      flex: none;
      font-family:
        "Courier New",
        Courier,
        monospace;
      font-size: 8px;
      color: #999;
      text-align: left;
      margin-right: 2px;
    }

    .deepweek-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #555;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .deepweek-legend .dw-dot {
      margin-left: 8px;
    }

    .deepweek-legend .dw-dot:first-child {
      margin-left: 0;
    }

    .deepweek-total {
      margin-left: 8px;
      color: #1c1c1c;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #888;
      padding: 24px 0;
    }

  </style>
</head>

<body>
  <header class="topbar">
    <a class="new-project-button" href="index.html">
      &lt;- BACK
    </a>
    <div class="topbar-title">TIME REPORT</div>
    <div></div>
  </header>

  <main>
    <pre id="reportPre">loading…</pre>

    <section id="deepweekSection" class="deepweek-section" hidden>
      <div class="deepweek-title">DEEP WEEK</div>
      <div id="deepWeekAxis" class="dw-axis"></div>
      <div id="deepWeekGrid"></div>
      <div class="deepweek-legend">
        <span class="dw-dot dw-work"></span> work
        <span class="dw-dot dw-empty"></span> empty
        <span class="dw-dot dw-deep"></span> deep
        <span id="deepWeekTotal" class="deepweek-total"></span>
      </div>
    </section>

    <div class="report-actions">
      <button id="copyButton" class="copy-button">
        COPY WEEK DATA
      </button>
      <span id="copyMsg" class="copy-msg"></span>
    </div>
  </main>

  <footer class="footer">
    ALL WORK AND NO PLAY MAKES ME A LLUD GIRL
  </footer>

  <script src="report.js?v=26"></script>
  <script>

    (function () {

      var STORAGE_KEY = "rithub-v2";


      function loadProjects() {

        var raw = null;


        try {

          raw = JSON.parse(
            localStorage.getItem(STORAGE_KEY)
          );

        } catch (e) {

          raw = null;

        }


        if (Array.isArray(raw)) {

          return raw;

        }


        if (raw && Array.isArray(raw.projects)) {

          return raw.projects;

        }


        return [];

      }


      var projects =
        loadProjects();

      var nowMs =
        Date.now();

      var reportText =
        buildReport(projects, nowMs);


      var pre =
        document.getElementById("reportPre");


      /*
        The text grid is replaced by the dot grid
        on web; the full text (with grid) is still
        what COPY WEEK DATA copies. GOALS stays as
        text — the report is analysis only; checking
        off happens on the project page.
      */
      pre.textContent =
        reportText.replace(
          /\nDEEP WEEK — 1 char = 1h[\s\S]*?\n\n(?=rules:)/,
          "\n"
        );


      renderDeepWeek(projects, nowMs);
      function renderDeepWeek(projects, nowMs) {

        var section =
          document.getElementById("deepweekSection");


        var commits =
          collectCommits(projects, nowMs);


        if (!commits.length) {

          return;

        }


        var days =
          last7Days(nowMs);

        var rows =
          deepWeekCells(commits, days, 30);

        var cls =
          ["dw-empty", "dw-work", "dw-deep"];


        var axis =
          document.getElementById("deepWeekAxis");

        var axisLabel =
          document.createElement("div");

        axisLabel.className =
          "dw-label";

        axisLabel.textContent =
          " ";

        axis.appendChild(axisLabel);


        var marks =
          {0: "0", 12: "6", 24: "12", 36: "18"};


        for (var s = 0; s < 48; s++) {

          var tick =
            document.createElement("div");

          tick.className =
            "dw-tick";

          tick.textContent =
            marks[s] || "";

          axis.appendChild(tick);

        }


        var grid =
          document.getElementById("deepWeekGrid");

        var dayNames =
          ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];


        days.forEach(function (ds, di) {

          var row =
            document.createElement("div");

          row.className =
            "dw-row";


          var label =
            document.createElement("div");

          label.className =
            "dw-label";


          var d =
            new Date(ds);

          label.textContent =
            dayNames[d.getDay()] + " " +
            ("0" + (d.getMonth() + 1)).slice(-2) + "-" +
            ("0" + d.getDate()).slice(-2);


          row.appendChild(label);


          var dots =
            document.createElement("div");

          dots.className =
            "dw-dots";


          rows[di].forEach(function (v) {

            var dot =
              document.createElement("div");

            dot.className =
              "dw-dot " + cls[v];

            dots.appendChild(dot);

          });


          row.appendChild(dots);

          grid.appendChild(row);

        });


        var st =
          deepWeekStats(commits, days);


        document
          .getElementById("deepWeekTotal")
          .textContent =
            st.deepH + "h / " + st.totalH + "h" +
            " (" + st.share + ")" +
            " · " + st.sessions + " sessions" +
            " · " + st.nights + "/7 nights";


        section.hidden =
          false;

      }


      var copyMsg =
        document.getElementById("copyMsg");


      function flash(msg) {

        copyMsg.textContent = msg;


        setTimeout(function () {

          copyMsg.textContent = "";

        }, 2000);

      }


      document
        .getElementById("copyButton")
        .addEventListener("click", function () {

          function done(ok) {

            flash(ok ? "COPIED" : "COPY FAILED");

          }


          if (
            navigator.clipboard &&
            navigator.clipboard.writeText
          ) {

            navigator.clipboard
              .writeText(reportText)
              .then(
                function () { done(true); },
                function () { fallback(); }
              );

          } else {

            fallback();

          }


          function fallback() {

            var ta =
              document.createElement("textarea");


            ta.value = reportText;

            ta.style.position = "fixed";

            ta.style.opacity = "0";


            document.body.appendChild(ta);

            ta.select();


            var ok = false;


            try {

              ok = document.execCommand("copy");

            } catch (e) {

              ok = false;

            }


            document.body.removeChild(ta);

            done(ok);

          }

        });

    })();

  </script>
</body>
</html>
